<style>
/* Layout: a procurement ledger. Rows and figures lead, a deep green band carries the live auction stair. */
:root{
  --bg:#F0F5F2;--surface:#FFFFFF;--sunk:#E5EDE8;--ink:#10251D;--muted:#51645B;--line:#D1DDD6;
  --accent:#0B6B4E;--accent-ink:#FFFFFF;--mark:#8F4E05;--mark-bg:#FCEBC8;--bad:#AE2A1F;--bad-bg:#FBE4E0;
  --ok:#0B6B4E;--ok-bg:#D9EFE4;--info:#1B5786;--info-bg:#DDEAF5;
  --band:#0C3B2E;--band-2:#134A3A;--band-ink:#ECF5F0;--band-muted:#A9C8BA;--gold:#F2B84B;--st:var(--accent);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1714;--surface:#15211C;--sunk:#1B2A24;--ink:#E6EFEA;--muted:#9DB2A8;--line:#2B3B34;
  --accent:#4CC59A;--accent-ink:#06251A;--mark:#F2B84B;--mark-bg:#3D2C0C;--bad:#F2938A;--bad-bg:#401B18;
  --ok:#4CC59A;--ok-bg:#12352A;--info:#8CC4F0;--info-bg:#12304A;
  --band:#0A2A20;--band-2:#103729;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1714;--surface:#15211C;--sunk:#1B2A24;--ink:#E6EFEA;--muted:#9DB2A8;--line:#2B3B34;
  --accent:#4CC59A;--accent-ink:#06251A;--mark:#F2B84B;--mark-bg:#3D2C0C;--bad:#F2938A;--bad-bg:#401B18;
  --ok:#4CC59A;--ok-bg:#12352A;--info:#8CC4F0;--info-bg:#12304A;
  --band:#0A2A20;--band-2:#103729;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2rem,1.4rem + 2.6vw,3.2rem);font-weight:800}
h2{font-size:clamp(1.45rem,1.2rem + 1vw,1.95rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.875rem}.stack{display:flex;flex-direction:column;gap:12px}.stack-lg{display:flex;flex-direction:column;gap:24px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.between{justify-content:space-between}
.label{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Header */
.strip{background:var(--sunk);font-size:.8125rem;color:var(--muted)}
.strip .wrap{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:center;padding-block:6px}
.strip select{font:inherit;padding:3px 6px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.head{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.head-main{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-block:10px}
.logo{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);font:800 1.3rem/1 var(--display);letter-spacing:-.02em}
.logo svg{width:28px;height:28px;color:var(--accent)}
.search{flex:1 1 240px;min-width:0;display:flex}
.search input{flex:1;min-width:0;border-right:0;border-radius:6px 0 0 6px}
.search button{border-radius:0 6px 6px 0}
nav.main{border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.main .wrap{display:flex;gap:2px;white-space:nowrap}
nav.main a{padding:9px 12px;text-decoration:none;color:var(--ink);font-size:.9375rem;font-weight:500;border-bottom:2px solid transparent}
nav.main a[aria-current="page"]{border-color:var(--accent);color:var(--accent)}
nav.main a:hover{background:var(--sunk)}
/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;font:600 .9375rem/1.2 var(--body);border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:6px 11px;font-size:.8125rem}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2B1C00}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px}
input[type=checkbox],input[type=radio]{width:auto}
input[type=file]{padding:7px}
textarea{min-height:84px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span:first-child{font-size:.875rem;font-weight:600}
.hint{font-size:.8125rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.check{display:flex;gap:7px;align-items:center;font-size:.9rem}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-size:.875rem;font-weight:600;padding:0;margin-bottom:4px}
/* Pills */
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--mark-bg);color:var(--mark)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
/* Panels and tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;min-width:0}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9375rem}
th{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;background:var(--sunk)}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted)}
section.block{padding-block:40px;display:flex;flex-direction:column;gap:20px}
.page{padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
.crumb{font-size:.875rem;color:var(--muted)}
/* Hero */
.hero{background:var(--band);color:var(--band-ink)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;padding-block:44px;align-items:center}
.hero p.lead{font-size:1.1rem;color:var(--band-muted);max-width:52ch}
.hero .btn:not(.gold){background:transparent;color:var(--band-ink);border-color:var(--band-muted)}
.board{background:var(--band-2);border-radius:8px;padding:20px;--st:var(--gold);display:flex;flex-direction:column;gap:10px;min-width:0}
.board .label{color:var(--band-muted)}
.board a{color:var(--band-ink)}
.l1{font:600 clamp(2rem,1.5rem + 2vw,2.9rem)/1 var(--mono);color:var(--gold);font-variant-numeric:tabular-nums}
.stair{width:100%;height:auto;display:block}
.stair path{fill:none;stroke:var(--st);stroke-width:2.5}
.stair circle{fill:var(--st)}
.stair text{font:500 11px var(--mono)}
.board .stair text{fill:var(--band-muted)}
.panel .stair text{fill:var(--muted)}
@keyframes flash{from{opacity:.35}to{opacity:1}}
.flash{animation:flash .5s ease-out}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
/* Comparison of methods */
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.methods>div{padding:20px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
/* Catalogue */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.zone{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;text-decoration:none;color:var(--ink)}
.zone:hover{border-color:var(--accent)}
.zone svg{width:38px;height:38px;flex:none;color:var(--accent)}
.zone b{display:block;line-height:1.25}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.thumb{background:var(--sunk);color:var(--accent);display:grid;place-items:center;aspect-ratio:16/10;max-width:100%}
.thumb svg{width:44%;height:auto}
.card .in{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .t{font-weight:600;line-height:1.3}
.price{font:600 1.05rem var(--mono)}
.mrp{font:400 .8125rem var(--mono);color:var(--muted);text-decoration:line-through}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px;margin:0}
.facts div{min-width:0}.facts dt{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:16px;list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;flex-direction:column;gap:4px}
.steps li::before{content:counter(s);font:600 .875rem var(--mono);color:var(--accent)}
/* Order timeline */
.track{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.track li{flex:1 1 120px;padding:8px 10px;font-size:.8125rem;border-top:3px solid var(--line);color:var(--muted)}
.track li.done{border-color:var(--accent);color:var(--ink);font-weight:600}
/* Dashboard */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{font:600 .9375rem var(--body);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:9px 13px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.stat b{display:block;font:600 1.4rem var(--mono)}
.todo{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:clamp(18px,4vw,40px);max-width:760px;display:flex;flex-direction:column;gap:18px}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
summary{font-weight:600;cursor:pointer}
details p{margin-top:8px;max-width:68ch}
.note{background:var(--mark-bg);color:var(--mark);padding:10px 14px;border-radius:6px;font-size:.9rem}
.note.info{background:var(--info-bg);color:var(--info)}
footer{background:var(--band);color:var(--band-muted);font-size:.9rem;margin-top:24px}
footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;padding-block:32px}
footer a{color:var(--band-ink);text-decoration:none;display:block;padding:2px 0}
footer b{color:var(--band-ink);font-family:var(--display)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:.9375rem;max-width:calc(100% - 32px);z-index:20}
@media (max-width:820px){
  .hero .wrap,.split{grid-template-columns:minmax(0,1fr)}
  .filters{grid-template-columns:1fr 1fr}.filters>:first-child{grid-column:1/-1}
  .head{position:static}
}

function V_tender(id){const t=S.tenders.find(x=>x.id===id);if(!t)return notFound();const st=standing(t);let panel='',b='';
 if(S.role==='guest'||S.role==='admin'){panel=S.role==='guest'?'<p>Log in as a verified seller to take part.</p><a class="btn pri" href="#login">Log in</a>':'<p class="muted">Admin view. Sellers bid and buyers evaluate from their own accounts.</p>'}

  if(t.declined.includes('S1'))panel='<p class="note">You declined this tender and can no longer take part.</p>';

  else if(!eligible(t)&&['bid','ra'].includes(t.phase))panel=`<p class="note">You need a published product in ${esc(catName(t.cat))} to take part${S.sellers[0].maintenance?', and your profile must be out of maintenance':''}.</p>`;
  else if(t.phase==='bid')panel=`<h3>Sealed bid</h3><p class="small muted">Other sellers cannot see your price. Attempt ${Math.min(att+1,3)} of 3.</p>${my?`<p class="small">Your current bid: <b class="num">${inr(my.p)}</b></p>`:''}${att>=3?'<p class="note">You have used all 3 attempts on this tender.</p>':`<form data-f="bid" data-id="${t.id}" class="stack"><label class="field"><span>Price per ${esc(t.unit)}, all-inclusive (₹)</span><input id="bid-price" type="number" min="1" step="0.01" required></label><button class="btn pri">${my?'Replace bid':'Submit bid'}</button></form>`}${my?`<button class="btn sm bad" data-a="withdraw" data-id="${t.id}">Withdraw bid</button>`:''}`;
  else if(t.phase==='ra'){const v=l1(t),mx=v?round(v*(1-S.fees.decrement/100)):t.est;panel=`<h3>Place a lower bid</h3><form data-f="ra" data-id="${t.id}" class="stack"><label class="field"><span>Your price per ${esc(t.unit)} (₹)</span><input id="ra-price" type="number" step="0.01" min="1" required placeholder="${mx}"><span class="hint">Must beat your own last bid. Bids at or above L1 are allowed, but only the lowest wins.</span></label><button class="btn pri">Submit bid</button></form>`}
  else if(t.phase==='ordered'&&t.awardTo==='S1')panel=`<a class="btn pri" href="#order-${t.orderId}">Open order</a>`;
  else panel=`<p class="muted">This tender is ${PH[t.phase][0].toLowerCase()}.</p>`}
 if(S.role==='buyer'){
  if(!t.mine)panel=`<p class="muted">Only ${esc(t.buyer)} can manage this tender. Buyers cannot bid.</p>`;
  else if(t.phase==='bid')panel=`<p>${t.bids.length} seller bid${t.bids.length===1?'':'s'} received. Sealed until closing.</p><button class="btn" data-a="close" data-id="${t.id}">End bidding now (demo)</button>`;

  else if(t.phase==='eval'&&t.type==='bid')panel=`<h3>Choose a seller</h3><div class="tablebox"><table><thead><tr><th>Rank</th><th>Seller</th><th class="r">Unit price</th><th></th></tr></thead><tbody>${st.map((x,i)=>`<tr><td class="num">L${i+1}</td><td>${esc(seller(x.s).name)}</td><td class="r num">${inr(x.p)}</td><td class="r"><button class="btn sm pri" data-a="award" data-id="${t.id}" data-s="${x.s}">Select</button></td></tr>`).join('')}</tbody></table></div>`;
  else if(t.phase==='eval'){const n=st.length;panel=`<h3>Shortlist for the auction</h3><div class="tablebox"><table><thead><tr><th>Rank</th><th>Seller</th><th class="r">Unit price</th></tr></thead><tbody>${st.map((x,i)=>`<tr><td class="num">L${i+1}</td><td>${esc(seller(x.s).name)}</td><td class="r num">${inr(x.p)}</td></tr>`).join('')}</tbody></table></div><div class="row"><button class="btn" data-a="elim" data-id="${t.id}" data-m="one" ${n<2?'disabled':''}>Remove highest bidder</button><button class="btn" data-a="elim" data-id="${t.id}" data-m="half" ${n<2?'disabled':''}>Remove highest 50%</button></div><button class="btn pri" data-a="startRa" data-id="${t.id}" ${t.elimDone?'':'disabled'}>Start reverse auction</button>`}
  else if(t.phase==='award')panel=`<p>Offered to <b>${esc(seller(t.awardTo).name)}</b> at <b class="num">${inr(st.find(x=>x.s===t.awardTo).p)}</b>. Waiting for the seller to accept.</p>`;

 if(t.phase==='ra')b=`<div class="panel stack" id="ra-live" data-t="${t.id}">${raLive(t)}</div>`;

 return `<div class="wrap page"><div class="crumb"><a href="#bids">Tenders</a> / <span class="mono">${esc(t.no)}</span></div><div class="stack"><div class="row">${pill(TYPE[t.type])}${pill(ph[0],ph[1])}${pill(t.kind==='custom'?'Custom tender':'Regular tender')}${['bid','ra'].includes(t.phase)?`<span class="small mono">Closes in <span data-cd="${t.ends}">${cd(t.ends)}</span></span>`:''}</div><h1 style="font-size:1.9rem">${esc(t.title)}</h1></div>
 <div class="split"><div class="stack-lg"><div class="panel"><dl class="facts"><div><dt>Buyer</dt><dd>${esc(t.buyer)}</dd></div><div><dt>Quantity</dt><dd class="num">${t.qty.toLocaleString('en-IN')} ${esc(t.unit)}</dd></div><div><dt>Consignee</dt><dd>${esc(t.consignee)}, ${esc(t.state)}</dd></div><div><dt>Category</dt><dd>${esc(catName(t.cat))}</dd></div><div><dt>Minimum bids</dt><dd class="num">${t.minBids}</dd></div><div><dt>Extensions left</dt><dd class="num">${t.ext-t.extUsed}</dd></div></dl></div>

 <aside class="stack">${b}<div class="panel stack">${panel}</div></aside></div></div>`}
function V_orderNew(id){if(S.role!=='buyer')return gate('buyer');const p=S.products.find(x=>x.id===id);if(!p)return notFound();

function V_order(id){const o=S.orders.find(x=>x.id===id);if(!o)return notFound();const isB=S.role==='buyer'&&o.mine,isS=S.role==='seller'&&o.sellerId==='S1',adm=S.role==='admin';if(!isB&&!isS&&!adm)return gate('buyer');

 const inc=(isB||isS)&&o.status!=='Cancelled'?`<details><summary>Raise an incident</summary><form data-f="incident" data-id="${o.id}" class="stack" style="margin-top:10px"><label class="field"><span>What went wrong?</span><textarea id="i-text" required></textarea></label><button class="btn">Submit incident</button></form></details>`:'';
 return `<div class="wrap page"><div class="crumb"><a href="#dashboard">Dashboard</a> / <span class="mono">${esc(o.no)}</span></div><div class="stack"><div class="row">${stPill(o.status)}${pill(o.source)}</div><h1 style="font-size:1.9rem">${esc(o.title)}</h1></div>${o.status==='Cancelled'?'':`<ol class="track">${flow.map(f=>`<li class="${done.includes(f)?'done':''}">${f}</li>`).join('')}</ol>`}

/* Router */
function route(){const h=location.hash.slice(1)||'home';let m,html;
 if(m=h.match(/^product-(P\d+)$/))html=V_product(m[1]);
 else if(h==='product-new')html=V_newProduct();
 else if(m=h.match(/^cat-(\w+)$/)){U.cat=m[1];U.q='';html=V.products()}
 else if(m=h.match(/^tender-new(?:-(P\d+))?$/))html=V_tenderNew(m[1]);
 else if(m=h.match(/^tender-(T\d+)$/))html=V_tender(m[1]);
 else if(m=h.match(/^order-new-(P\d+)$/))html=V_orderNew(m[1]);
 else if(m=h.match(/^order-(O\d+)$/))html=V_order(m[1]);
 else if(m=h.match(/^report-(O\d+)$/))html=V_report(m[1]);
 else html=V[h]?V[h]():notFound();
 $('#view').innerHTML=html;
 const nav=[['home','Home'],['category','Categories'],['products','Products'],['bids','Tenders'],['how-it-works','How it works'],['guides','Guides'],['pricing','Fees'],['contact','Support']];
 const cur=h.startsWith('cat-')||h.startsWith('product')?'products':h.startsWith('tender')?'bids':h;
 $('#nav').innerHTML=nav.map(n=>`<a href="#${n[0]}" ${cur===n[0]?'aria-current="page"':''}>${n[1]}</a>`).join('');
 $('#role-switch').value=S.role;
 $('#head-actions').innerHTML=S.role==='guest'?'<a class="btn" href="#login">Log in</a><a class="btn pri" href="#signup">Sign up</a>':'<a class="btn pri" href="#dashboard">Dashboard</a><button class="btn" data-a="logout">Log out</button>';
}
function render(){const y=window.scrollY;route();window.scrollTo(0,y)}
function commit(msg){save();render();if(msg)toast(msg)}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});

/* Actions */
const A={
 login(e){S.role=e.dataset.r;save();location.hash='dashboard';toast('Logged in.')},
 logout(){S.role='guest';save();location.hash='home';render()},
 reset(){S=seed();Object.assign(U,{tab:{},q:'',cat:'',state:''});save();render();toast('Demo data reset.')},
 tab(e){U.tab[e.dataset.k]=e.dataset.v;render()},
 tf(e){U.tf=e.dataset.v;render()},
 signRole(e){U.signRole=e.dataset.v;render()},
 close(e){const t=S.tenders.find(x=>x.id===e.dataset.id);commit(closePhase(t))},
 award(e){const t=S.tenders.find(x=>x.id===e.dataset.id);t.phase='award';t.awardTo=e.dataset.s;t.awardAt=Date.now();commit(`Offer sent to ${seller(t.awardTo).name}.`)},
 elim(e){const t=S.tenders.find(x=>x.id===e.dataset.id),st=standing(t),n=e.dataset.m==='half'?Math.floor(st.length/2):1;st.slice(-n).forEach(b=>t.elim.push(b.s));t.elimDone=true;commit(`${n} seller${n>1?'s':''} removed.`)},
 startRa(e){const t=S.tenders.find(x=>x.id===e.dataset.id);t.phase='ra';t.ends=Date.now()+3*H;commit('Reverse auction started.')},
 withdraw(e){const t=S.tenders.find(x=>x.id===e.dataset.id);t.bids=t.bids.filter(b=>b.s!=='S1');commit('Bid withdrawn.')},
 tAccept(e){const t=S.tenders.find(x=>x.id===e.dataset.id),o=createTenderOrder(t);save();location.hash='order-'+o.id;toast('Tender accepted. Order created.')},
 tReject(e){const t=S.tenders.find(x=>x.id===e.dataset.id);t.declined.push('S1');const m=strike(),nx=standing(t)[0];if(nx){t.awardTo=nx.s;t.awardAt=Date.now()}else cancelTender(t,'All sellers declined.');commit('Tender rejected. '+m)},
 oAccept(e){const o=S.orders.find(x=>x.id===e.dataset.id);o.status='Accepted';o.log.push(['Accepted',Date.now()]);led('seller','Fee on '+o.no,feeOf(o.price*o.qty,S.fees.direct),'Paid');commit('Order accepted. Buyer contact details are now visible.')},
 oReject(e){const o=S.orders.find(x=>x.id===e.dataset.id);o.status='Cancelled';ledMove('buyer',o.no,'Available');commit('Order rejected. The buyer has been told.')},
 pub(e){const p=S.products.find(x=>x.id===e.dataset.id);p.status=p.status==='Published'?'Unpublished':'Published';commit('Product '+p.status.toLowerCase()+'.')},
 resubmit(e){const p=S.products.find(x=>x.id===e.dataset.id);p.status='Pending';p.note='';commit('Sent for verification.')},
 pv(e){const p=S.products.find(x=>x.id===e.dataset.id),v=e.dataset.v;p.status=v;p.note=v==='Notify'?'Add a clearer specification sheet.':v==='Rejected'?'Does not meet listing rules.':'';commit(v==='Published'?'Product published.':v==='Notify'?'Sent back to the seller.':'Product rejected.')},
 av(e){const a=S.signups.find(x=>x.id===e.dataset.id);S.signups=S.signups.filter(x=>x!==a);commit(e.dataset.v?a.name+' approved.':a.name+' rejected.')},
 iv(e){const i=S.incidents.find(x=>x.id===e.dataset.id);i.status='Closed';i.out=e.dataset.v;commit('Incident closed.')},
 tix(e){S.tickets.find(x=>x.id===e.dataset.id).status='Closed';commit('Ticket resolved.')},

};
const F={
 search(f){const q=$('#top-search').value.trim();U.q=q;U.cat='';if(location.hash==='#products')render();else location.hash='products'},
 bid(f){const t=S.tenders.find(x=>x.id===f.dataset.id),p=+$('#bid-price').value;t.attempts.S1=(t.attempts.S1||0)+1;t.bids=t.bids.filter(b=>b.s!=='S1');t.bids.push({s:'S1',p,t:Date.now()});commit('Bid submitted.')},
 ra(f){const t=S.tenders.find(x=>x.id===f.dataset.id),p=+$('#ra-price').value,mine=[...t.bids].reverse().find(b=>b.s==='S1');if(mine&&p>=mine.p)return toast(`Enter less than your last bid of ${inr(mine.p)}.`);t.bids.push({s:'S1',p,t:Date.now()});$('#ra-price').value='';save();live();toast('Bid recorded.')},
 order(f){const p=S.products.find(x=>x.id===f.dataset.id),q=+$('#o-qty').value,tot=round(net(p)*q),g=$('#o-gst').value.trim().toUpperCase();if(tot>=S.fees.limitOrg)return toast(`Direct orders must stay under ${inr(S.fees.limitOrg)}. Create a tender instead.`);if(!GST_RE.test(g))return toast('Enter a 15-character GSTIN, for example 23AABCN1234F1Z5.');
  const o={id:nid('O'),no:'BMO-26-'+S.seq,source:'Direct order',title:p.title,cat:p.cat,qty:q,unit:p.unit,price:net(p),sellerId:p.sellerId,buyer:S.buyer.name,mine:true,state:$('#o-state').value,consignee:$('#o-cons').value,status:'Awaiting seller',log:[['Placed',Date.now()]],docs:{},placedAt:Date.now()};
  S.orders.unshift(o);p.stock-=q;p.sales+=q;led('buyer','Fee on '+o.no,feeOf(tot,S.fees.direct),'On hold');save();location.hash='order-'+o.id;toast('Fee paid. Order sent to the seller.')},
 tender(f){const pid=f.dataset.p,p=pid?S.products.find(x=>x.id===pid):null,g=$('#t-gst').value.trim().toUpperCase();if(!GST_RE.test(g))return toast('Enter a 15-character GSTIN, for example 23AABCN1234F1Z5.');
  const type=$('input[name=t-type]:checked').value,qty=+$('#t-qty').value,est=+$('#t-est').value,specs=p?p.specs:parseSpecs($('#t-specs').value),hrs=+$('#t-hrs').value;
  const no=`BM/26/${type==='ra'?'RA':type==='bid'?'BD':'BR'}/${String(++S.seq).padStart(5,'0')}`,cat=p?p.cat:$('#t-cat').value;
  const t={id:nid('T'),no,title:p?p.title:$('#t-title').value,cat,kind:p?'regular':'custom',type,phase:type==='ra'?'ra':'bid',qty,unit:$('#t-unit').value,est,floor:round(est*.84),buyer:S.buyer.name,mine:true,state:$('#t-state').value,consignee:$('#t-cons').value,specs,minBids:+$('#t-min').value,ext:+$('#t-ext').value,extUsed:0,ends:Date.now()+hrs*H,elim:[],declined:[],attempts:{},bids:[]};
  rivalsFor(cat).slice(0,3).forEach((s,i)=>t.bids.push({s,p:round(est*(.99-i*.025)),t:Date.now()-(3-i)*1e3}));
  S.tenders.unshift(t);led('buyer','Fee on '+no,p?feeOf(qty*est,S.fees.tender):S.fees.customFixed,'On hold');save();location.hash='tender-'+t.id;toast('Tender published. Example sellers have joined.')},
 dispatch(f){const o=S.orders.find(x=>x.id===f.dataset.id);o.docs={bill:$('#d-bill').value,eway:$('#d-eway').value,lr:$('#d-lr').value};o.status='Dispatched';o.log.push(['Dispatched',Date.now()]);commit('Order marked as dispatched.')},
 receive(f){const o=S.orders.find(x=>x.id===f.dataset.id);o.proof=$('#r-proof').files[0].name;o.status='Completed';o.log.push(['Completed',Date.now()]);ledMove('buyer',o.no,'Paid');const t=S.tenders.find(x=>x.id===o.tender);if(t)ledMove('buyer',t.no,'Paid');commit('Receipt confirmed. Acceptance report ready.')},
 incident(f){const o=S.orders.find(x=>x.id===f.dataset.id),id=nid('INC-');S.incidents.unshift({id,ref:o.no,by:S.role==='buyer'?S.buyer.name:S.sellers[0].name,against:S.role==='buyer'?seller(o.sellerId).name:o.buyer,text:$('#i-text').value,status:'Open',t:Date.now()});commit(`Incident ${id} raised.`)},
 ticket(f){const id=nid('TKT-');S.tickets.unshift({id,type:$('#c-type').value,text:$('#c-text').value,by:S.role==='buyer'?S.buyer.name:S.role==='seller'?S.sellers[0].name:'Visitor',status:'Open',t:Date.now()});commit(`Ticket ${id} logged. Track it from Admin in this demo.`)},
 product(f){const imgs=$('#n-img').files,st=$$('input[name=n-st]:checked').map(x=>x.value);if(imgs.length!==3)return toast(`Add exactly 3 images. You selected ${imgs.length}.`);if(!st.length)return toast('Select at least one state.');
  const p={id:'P'+(++S.seq),title:$('#n-title').value,cat:$('#n-cat').value,mrp:+$('#n-mrp').value,disc:+$('#n-disc').value,unit:$('#n-unit').value,stock:+$('#n-stock').value,sellerId:'S1',specs:parseSpecs($('#n-specs').value),sales:0,status:'Pending',states:st,note:''};S.products.push(p);U.tab.s='products';save();location.hash='dashboard';render();toast('Submitted. An admin will verify it.')},
 signup(f){const r=U.signRole||'seller',pan=$('#s-pan').value.trim().toUpperCase(),g=$('#s-gst').value.trim().toUpperCase();if(!PAN_RE.test(pan))return toast('PAN must be 10 characters, for example AAAAA0000A.');if(g&&!GST_RE.test(g))return toast('GSTIN must be 15 characters, for example 22AAAAA0000A1Z5.');
  S.signups.push({id:nid('A'),role:r==='seller'?'Seller':'Buyer',name:$('#s-name').value,type:$('#s-type').value,pan,gst:g});save();location.hash='home';toast(r==='seller'?'Registration received. See it in Admin approvals.':'Submitted for admin review.')},
 fees(f){$$('input[data-k]',f).forEach(i=>S.fees[i.dataset.k]=+i.value);commit('Fees and limits saved.')}
};
const parseSpecs=s=>{const o={};s.split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0)o[l.slice(0,i).trim()]=l.slice(i+1).trim()});if(!Object.keys(o).length&&s.trim())o.Details=s.trim();return o};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled){if(b.tagName==='A')e.preventDefault();A[b.dataset.a](b)}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(f){e.preventDefault();F[f.dataset.f](f)}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='f-q'){U.q=t.value;$('#plist').innerHTML=plist()}
 if(t.id==='calc-to')$('#calc-out').textContent=inr(subFee(+t.value||0));
 if(t.id==='s-to')$('#s-fee').textContent=inr(subFee(+t.value||0));
 if(t.id==='o-qty'){const p=S.products.find(x=>x.id===$('form[data-f=order]').dataset.id);$('#o-sum').innerHTML=orderSum(p,+t.value||0)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='role-switch'){S.role=t.value;save();render();toast(t.value==='guest'?'Viewing as a visitor.':'Viewing as '+t.value+'.')}
 if(t.id==='f-cat'){U.cat=t.value;$('#plist').innerHTML=plist()}
 if(t.id==='f-state'){U.state=t.value;$('#plist').innerHTML=plist()}
 if(t.id==='f-sort'){U.sort=t.value;$('#plist').innerHTML=plist()}
 if(t.id==='maint'){S.sellers[0].maintenance=t.checked;commit(t.checked?'Maintenance on. Products hidden.':'Maintenance off. Products visible.')}});

/* Live loop: countdowns, simulated rival bids and rival sellers */
function live(){const hb=$('#hero-board');if(hb)hb.innerHTML=heroBoard();const box=$('#ra-live');if(box){const t=S.tenders.find(x=>x.id===box.dataset.t);if(t&&t.phase==='ra')box.innerHTML=raLive(t)}}
let beat=0;
setInterval(()=>{beat++;$$('[data-cd]').forEach(el=>el.textContent=cd(+el.dataset.cd));let changed=false,msg='',bids=false;const n=Date.now();
 S.tenders.forEach(t=>{
  if((t.phase==='bid'||t.phase==='ra')&&n>=t.ends){msg=closePhase(t);changed=true}
  if(t.phase==='ra'&&beat%8===0&&Math.random()<.7){const v=l1(t),pool=[...new Set(t.bids.map(b=>b.s))].filter(s=>s!=='S1'&&!t.elim.includes(s));if(v&&pool.length){const p=round(v*(1-S.fees.decrement/100*(1+Math.random())));if(p>=t.floor){t.bids.push({s:pool[Math.floor(Math.random()*pool.length)],p,t:n});bids=true}}}
  if(t.phase==='award'&&t.awardTo!=='S1'&&n-t.awardAt>3000){createTenderOrder(t);changed=true;msg=seller(t.awardTo).name+' accepted the tender.'}});
 S.orders.forEach(o=>{const last=o.log[o.log.length-1][1];
  if(o.sellerId!=='S1'&&o.status==='Awaiting seller'&&n-last>4000){o.status='Accepted';o.log.push(['Accepted',n]);changed=true;msg='The seller accepted your order.'}
  else if(o.sellerId!=='S1'&&o.status==='Accepted'&&n-last>5000){o.status='Dispatched';o.docs={bill:'EX-'+o.no.slice(-4),eway:'3210 5500 '+o.no.slice(-4),lr:'LR-'+o.no.slice(-4)};o.log.push(['Dispatched',n]);changed=true;msg='The seller dispatched your order.'}});
 if(changed)commit(msg);else if(bids){save();live()}
},1000);
route();
</script>
